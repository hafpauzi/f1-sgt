<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 SGT</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="card">

  <div class="header">
    <h1>🏁 F1 SGT</h1>
    <span>Singapore Time</span>
    <button id="themeToggle">

    </button>
  </div>

  <div class="section-title">
    NEXT SESSION
  </div>

  <div class="race-name" id="raceName">
    Loading...
  </div>

  <div class="session-box">

    <div class="session">
      <div class="session-label" id="sessionName">
        Session
      </div>

      <div class="session-time" id="sessionTime">
        --
      </div>
    </div>

    <div class="countdown">
      <div class="count-label">
        STARTS IN
      </div>

      <div id="countdown">
        --:--:--
      </div>
    </div>

  </div>

  <div class="divider"></div>

  <div class="section-title">
    WEEKEND SCHEDULE
  </div>

  <div id="schedule">
    Loading...
  </div>

</div>


  <script src="script.js"></script>
</body>
</html>
